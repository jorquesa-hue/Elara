<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --line:#e4e8f0; --text:#1b2333; --muted:#5c6678;
    --accent:#6572ff; --accent-soft:#ececff; --ok:#10b981; --warn:#f59e0b; --radius:14px;
    --font-ui:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#0b0e14; --card:#12161f; --line:#232a37; --text:#e6e9f0; --muted:#98a2b5;
    --accent-soft:#20233a;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 var(--font-ui);font-variant-numeric:tabular-nums;background:var(--bg);color:var(--text)}
  h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em}
  a{color:var(--accent)}
  .wrap{max-width:860px;margin:0 auto;padding:20px 18px 60px}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
  .mark{width:34px;height:34px;border-radius:9px;background:center/cover no-repeat url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22b%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236D8BFF%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238B6CFF%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2230%22%20fill%3D%22url%28%23b%29%22%2F%3E%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M%2024.40%2029.00%20Q%2024.40%2016.00%2037.40%2016.00%20L%2090.60%2016.00%20Q%20103.60%2016.00%20103.60%2029.00%20L%20103.60%2031.51%20Q%20103.60%2044.51%2090.60%2044.51%20L%2059.92%2044.51%20Q%2056.08%2044.51%2056.08%2048.35%20L%2056.08%2048.35%20Q%2056.08%2052.19%2059.92%2052.19%20L%2074.73%2052.19%20Q%2086.73%2052.19%2086.73%2064.19%20L%2086.73%2064.19%20Q%2086.73%2076.19%2074.73%2076.19%20L%2059.73%2076.19%20Q%2056.08%2076.19%2056.08%2079.84%20L%2056.08%2079.84%20Q%2056.08%2083.49%2059.73%2083.49%20L%2090.60%2083.49%20Q%20103.60%2083.49%20103.60%2096.49%20L%20103.60%2099.00%20Q%20103.60%20112.00%2090.60%20112.00%20L%2037.40%20112.00%20Q%2024.40%20112.00%2024.40%2099.00%20Z%22%2F%3E%3C%2Fsvg%3E");font-size:0}
  .mark img{width:34px;height:34px;border-radius:9px;object-fit:cover}
  h1{font-size:22px;margin:0}
  h2{font-size:16px;margin:22px 0 10px}
  .sub{color:var(--muted);margin:2px 0 0}
  .spacer{flex:1}
  .btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
  .kpi .v{font-size:24px;font-weight:700} .kpi .k{color:var(--muted);font-size:12.5px;margin-top:3px}
  .lease{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .lease .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
  .pill.warn{background:rgba(224,83,58,.14);color:var(--warn)}
  .pill.ok{background:rgba(15,157,88,.14);color:var(--ok)}
  .banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px}
  .field{margin:0 0 12px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--muted)}
  .toast{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 15px;box-shadow:0 8px 30px rgba(0,0,0,.12);font-size:14px}
  .toast .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px}
  .toast.err .dot{background:var(--warn)}
  .gate{max-width:380px;margin:12vh auto 0}
</style>
<div id="root"></div>
<script>
(function(){
  var TOKEN_KEY="usos.res.token", REFRESH_KEY="usos.res.refresh", THEME_KEY="usos.theme";
  var state={ token:localStorage.getItem(TOKEN_KEY)||"", refresh:localStorage.getItem(REFRESH_KEY)||"", auth:null, me:null, home:null };

  function h(tag,attrs,kids){ var e=document.createElement(tag); attrs=attrs||{};
    for(var k in attrs){ if(k==="onclick"||k==="onsubmit"||k==="onchange") e[k]=attrs[k];
      else if(attrs[k]!=null) e.setAttribute(k,attrs[k]); }
    (kids||[]).forEach(function(c){ if(c==null)return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
    return e; }
  function fmtMoney(minor){ var c=(state.home&&state.home.currency)||"USD"; try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:c}).format((minor||0)/100);}catch(e){ return (c+" "+((minor||0)/100).toFixed(2)); } }
  function toast(msg,kind){ var t=h("div",{class:"toast"+(kind==="err"?" err":"")},[h("span",{class:"dot"}),msg]); document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }
  function setSession(a,r){ state.token=a||""; state.refresh=r||""; if(a)localStorage.setItem(TOKEN_KEY,a);else localStorage.removeItem(TOKEN_KEY); if(r)localStorage.setItem(REFRESH_KEY,r);else localStorage.removeItem(REFRESH_KEY); }

  function api(path,opts){ opts=opts||{};
    return fetch(path,{ method:opts.method||"GET", headers:{ "authorization":"Bearer "+state.token, "content-type":"application/json" }, body:opts.body?JSON.stringify(opts.body):undefined })
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(b){
        if(r.status===401 && state.refresh && state.auth && state.auth.mode==="supabase" && !opts._retried){
          return refresh().then(function(ok){ if(ok){ opts._retried=true; return api(path,opts); } return {status:401,body:b}; });
        }
        return {status:r.status,body:b};
      }); });
  }
  function refresh(){ return fetch(state.auth.authUrl+"/token?grant_type=refresh_token",{ method:"POST", headers:{ "content-type":"application/json","apikey":state.auth.anonKey }, body:JSON.stringify({refresh_token:state.refresh}) })
      .then(function(r){return r.json();}).then(function(j){ if(j.access_token){ setSession(j.access_token,j.refresh_token); return true; } setSession("",""); return false; }).catch(function(){return false;}); }

  function theme(){ var saved=localStorage.getItem(THEME_KEY)||"light"; document.documentElement.setAttribute("data-theme",saved); }
  function toggleTheme(){ var next=(localStorage.getItem(THEME_KEY)==="dark")?"light":"dark"; localStorage.setItem(THEME_KEY,next); document.documentElement.setAttribute("data-theme",next); }

  function boot(){ theme();
    fetch("/auth/config").then(function(r){return r.json();}).then(function(cfg){ state.auth=cfg; if(!state.token) return renderGate();
      api("/me").then(function(r){ if(r.status===200 && r.body.partyId){ state.me=r.body; load(); } else if(r.status===200){ renderNotResident(); } else renderGate(); });
    }).catch(function(){ state.auth={mode:"dev"}; renderGate(); });
  }

  function renderGate(){ var root=document.getElementById("root"); root.innerHTML="";
    var box=h("div",{class:"card gate"},[]);
    box.appendChild(h("header",{},[ h("div",{class:"mark"},["E"]), h("h1",{},["Resident portal"]) ]));
    if(state.auth && state.auth.mode==="supabase"){
      var em=h("input",{type:"email",placeholder:"you@email.com"}); var pw=h("input",{type:"password",placeholder:"Password"});
      box.appendChild(h("form",{onsubmit:function(e){e.preventDefault();
        fetch(state.auth.authUrl+"/token?grant_type=password",{ method:"POST", headers:{ "content-type":"application/json","apikey":state.auth.anonKey }, body:JSON.stringify({email:em.value,password:pw.value}) })
          .then(function(r){return r.json();}).then(function(j){ if(j.access_token){ setSession(j.access_token,j.refresh_token); boot(); } else toast(j.error_description||j.msg||"Sign-in failed","err"); });
      }},[ h("div",{class:"field"},[h("label",{},["Email"]),em]), h("div",{class:"field"},[h("label",{},["Password"]),pw]), h("button",{class:"btn",type:"submit"},["Sign in"]) ]));
    } else {
      var tk=h("input",{placeholder:"Paste resident token"});
      box.appendChild(h("form",{onsubmit:function(e){e.preventDefault(); setSession(tk.value.trim(),""); boot();}},[ h("div",{class:"field"},[h("label",{},["Access token"]),tk]), h("button",{class:"btn",type:"submit"},["Enter"]) ]));
      box.appendChild(h("p",{class:"sub"},["Dev mode — paste a party-scoped token."]));
    }
    root.appendChild(h("div",{class:"wrap"},[box]));
  }
  function renderNotResident(){ var root=document.getElementById("root"); root.innerHTML="";
    root.appendChild(h("div",{class:"wrap"},[ h("div",{class:"card gate"},[ h("h2",{},["Not a resident account"]), h("p",{class:"sub"},["This portal is for residents. Operators sign in at the main portal."]), h("button",{class:"btn ghost sm",onclick:function(){ setSession("",""); renderGate(); }},["Sign out"]) ]) ]));
  }

  function load(){ api("/resident/home").then(function(r){ if(r.status!==200){ toast((r.body||{}).error||"Could not load","err"); return renderGate(); } state.home=r.body; render(); }); }

  function render(){ var root=document.getElementById("root"); root.innerHTML="";
    var wrap=h("div",{class:"wrap"},[]);
    var head=h("header",{},[ h("div",{class:"mark"},["E"]), h("div",{},[ h("h1",{},["Hi, "+(state.home.profile.name||"resident")]), h("div",{class:"sub"},["Your home with us"]) ]), h("div",{class:"spacer"}), h("button",{class:"btn ghost sm",onclick:toggleTheme},["Theme"]), h("button",{class:"btn ghost sm",onclick:function(){ setSession("",""); renderGate(); }},["Sign out"]) ]);
    wrap.appendChild(head);
    // KPIs
    var cards=h("div",{class:"cards"},[]);
    cards.appendChild(kpi("Balance due", fmtMoney(state.home.totalBalanceCents), state.home.totalBalanceCents>0?"warn":"ok"));
    cards.appendChild(kpi("Deposit held", fmtMoney(state.home.totalDepositCents)));
    cards.appendChild(kpi("Leases", String((state.home.agreements||[]).length)));
    wrap.appendChild(cards);
    // Payments — open invoices + a non-charging "I've paid" signal for the office.
    if(state.home.totalBalanceCents>0){
      wrap.appendChild(h("h2",{},["Payments"]));
      var payWrap=h("div",{},[]); wrap.appendChild(payWrap); refreshInvoices(payWrap);
    }
    // Renewal banner
    (state.home.renewalOffers||[]).forEach(function(o){
      wrap.appendChild(h("div",{class:"banner"},[ h("strong",{},["Renewal available"]), h("div",{class:"sub"},["Your lease can renew at "+fmtMoney(o.proposedRateCents)+"/mo through "+o.proposedEnd+". Contact the office to accept."]) ]));
    });
    // Leases
    wrap.appendChild(h("h2",{},["My lease"+((state.home.agreements||[]).length===1?"":"s")]));
    if(!(state.home.agreements||[]).length) wrap.appendChild(h("div",{class:"card muted"},["No active lease on file."]));
    (state.home.agreements||[]).forEach(function(a){
      var cls = a.status==="active"?"ok":"";
      var docBox=h("div",{},[]);
      var actions=h("div",{class:"row",style:"margin-top:12px;gap:8px"},[
        h("button",{class:"btn ghost sm",onclick:function(){ api("/resident/agreements/"+a.id+"/lease-document").then(function(r){ docBox.innerHTML=""; if(r.status!==200) return toast((r.body||{}).error||"Error","err"); docBox.appendChild(h("pre",{style:"white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px"},[r.body.text])); }); }},["View lease"])
      ]);
      if((state.home.renewalOffers||[]).some(function(o){return o.agreementId===a.id;}))
        actions.appendChild(h("button",{class:"btn sm",onclick:function(){ api("/resident/renewal-interest",{method:"POST",body:{agreementId:a.id}}).then(function(r){ if(r.status===201) toast("The office has been notified you'd like to renew","ok"); else toast((r.body||{}).error||"Error","err"); }); }},["I'd like to renew"]));
      wrap.appendChild(h("div",{class:"lease"},[
        h("div",{class:"row"},[ h("strong",{},[a.unitLabel]), h("span",{class:"pill "+cls},[a.status]) ]),
        h("div",{class:"row",style:"margin-top:8px"},[
          h("div",{},[ h("div",{class:"muted",style:"font-size:12px"},["Rent"]), h("div",{},[fmtMoney(a.rateCents)+"/mo"]) ]),
          h("div",{},[ h("div",{class:"muted",style:"font-size:12px"},["Term"]), h("div",{},[a.start+" → "+a.end]) ]),
          h("div",{},[ h("div",{class:"muted",style:"font-size:12px"},["Balance"]), h("div",{},[fmtMoney(a.balanceCents)]) ]),
          h("div",{},[ h("div",{class:"muted",style:"font-size:12px"},["Expires in"]), h("div",{},[(a.daysToExpiry>=0?a.daysToExpiry+" days":"—")]) ])
        ]),
        actions, docBox
      ]));
    });
    // Documents awaiting signature
    var docsWrap=h("div",{},[]); wrap.appendChild(docsWrap); refreshEnvelopes(docsWrap);
    // Renters insurance coverage
    var insWrap=h("div",{},[]); wrap.appendChild(insWrap); refreshInsurance(insWrap);
    // Packages awaiting pickup
    var pkgWrap=h("div",{},[]); wrap.appendChild(pkgWrap); refreshParcels(pkgWrap);
    // Maintenance
    wrap.appendChild(h("h2",{},["Maintenance"]));
    wrap.appendChild(maintenanceForm());
    var moWrap=h("div",{style:"margin-top:12px"},[]); wrap.appendChild(moWrap); refreshWorkOrders(moWrap);
    document.getElementById("root").appendChild(wrap);
  }
  function kpi(k,v,tone){ return h("div",{class:"card kpi"},[ h("div",{class:"v"},[v]), h("div",{class:"k"},[k]) ]); }

  function maintenanceForm(){
    var leases=(state.home.agreements||[]);
    if(!leases.length) return h("div",{class:"card muted"},["Add a lease to submit maintenance requests."]);
    var ag=h("select",{}, leases.map(function(a){ return h("option",{value:a.id},[a.unitLabel]); }));
    var title=h("input",{placeholder:"What needs fixing? e.g. Leaky faucet"});
    var pri=h("select",{},[["low","Low"],["medium","Medium"],["high","High"],["urgent","Urgent"]].map(function(p){return h("option",{value:p[0]},[p[1]]);}));
    var desc=h("textarea",{rows:"3",placeholder:"Any details (optional)"});
    return h("form",{class:"card",onsubmit:function(e){e.preventDefault();
      if(!title.value) return toast("Describe the issue","err");
      api("/resident/work-orders",{method:"POST",body:{ agreementId:ag.value, title:title.value, priority:pri.value, description:desc.value||undefined }}).then(function(r){
        if(r.status===201){ toast("Request submitted","ok"); title.value=desc.value=""; load(); } else toast((r.body||{}).error||"Error","err");
      });
    }},[
      leases.length>1?h("div",{class:"field"},[h("label",{},["Unit"]),ag]):ag,
      h("div",{class:"field"},[h("label",{},["Issue"]),title]),
      h("div",{class:"field"},[h("label",{},["Priority"]),pri]),
      h("div",{class:"field"},[h("label",{},["Details"]),desc]),
      h("button",{class:"btn",type:"submit"},["Submit request"])
    ]);
  }
  function refreshEnvelopes(wrap){ api("/resident/envelopes").then(function(r){ wrap.innerHTML="";
    var list=((r.body||{}).envelopes)||[];
    if(!list.length) return;
    wrap.appendChild(h("h2",{},["Documents"]));
    var rows=list.map(function(e){
      var st=e.mySignerStatus, cls = st==="signed"?"ok":(st==="declined"?"warn":"");
      var label = st==="awaiting"?"Awaiting your signature":(st==="signed"?"You signed":(st==="declined"?"Declined":"Being prepared"));
      return h("tr",{},[ h("td",{},[e.documentName]), h("td",{class:"muted"},[e.provider]), h("td",{},[h("span",{class:"pill "+cls},[label])]) ]);
    });
    wrap.appendChild(h("table",{},[ h("thead",{},[h("tr",{},[th("Document"),th("Provider"),th("Status")])]), h("tbody",{},rows) ]));
    wrap.appendChild(h("div",{class:"muted",style:"font-size:12px;margin-top:6px"},["When a document is awaiting your signature, sign it via the email the provider sends you."]));
  }); }
  function refreshInsurance(wrap){ api("/resident/insurance").then(function(r){ wrap.innerHTML="";
    var leases=((r.body||{}).leases)||[];
    var withPolicies=leases.filter(function(l){ return (l.policies||[]).length || l.coverage!=="none"; });
    if(!leases.length) return;
    wrap.appendChild(h("h2",{},["Renters insurance"]));
    var COV={ compliant:["You're covered","ok"], expiring:["Coverage expiring soon","warn"], lapsed:["Coverage lapsed — please renew","warn"], none:["No policy on file","warn"] };
    leases.forEach(function(l){
      var c=COV[l.coverage]||COV.none;
      var rows=(l.policies||[]).map(function(p){ return h("div",{class:"muted",style:"font-size:12px;margin-top:4px"},[p.carrier+" · "+p.policyNumber+" · through "+p.expiresAt+" ("+p.status+")"]); });
      wrap.appendChild(h("div",{class:"card"},[ h("div",{class:"row"},[ h("strong",{},["Lease "+l.agreementId]), h("span",{class:"pill "+c[1]},[c[0]]) ]) ].concat(rows.length?rows:[h("div",{class:"muted",style:"font-size:12px;margin-top:4px"},["Please file a renters-insurance certificate with the office."]) ]) ));
    });
  }); }
  function refreshParcels(wrap){ api("/resident/parcels").then(function(r){ wrap.innerHTML="";
    var all=((r.body||{}).parcels)||[];
    var awaiting=all.filter(function(p){ return p.status!=="picked_up"; });
    if(!awaiting.length) return;
    wrap.appendChild(h("h2",{},["Packages"]));
    wrap.appendChild(h("div",{class:"muted",style:"font-size:13px;margin-bottom:8px"},[awaiting.length+" parcel"+(awaiting.length===1?"":"s")+" waiting for you at the front desk."]));
    awaiting.forEach(function(p){
      wrap.appendChild(h("div",{class:"card"},[ h("div",{class:"row"},[ h("strong",{},[p.carrier+(p.description?" · "+p.description:"")]), h("span",{class:"pill ok"},[p.daysWaiting+"d waiting"]) ]), (p.location?h("div",{class:"muted",style:"font-size:12px;margin-top:4px"},["Pick up at: "+p.location]):"") ]));
    });
  }); }
  function refreshInvoices(wrap){ api("/resident/invoices").then(function(r){ wrap.innerHTML="";
    var open=(((r.body||{}).invoices)||[]).filter(function(i){return i.outstandingCents>0;});
    if(!open.length){ wrap.appendChild(h("div",{class:"muted",style:"font-size:13px"},["You're all paid up."])); return; }
    var rows=open.map(function(i){
      return h("tr",{},[
        h("td",{},[i.id]),
        h("td",{class:"muted"},[(i.dueAt||"").slice(0,10)]),
        h("td",{},[fmtMoney(i.outstandingCents)]),
        h("td",{},[ h("button",{class:"btn ghost sm",onclick:function(){
          if(!confirm("Only confirm after you've sent the payment. This notifies the office to reconcile it — it is not a live charge.")) return;
          api("/resident/payment-intent",{method:"POST",body:{invoiceId:i.id,amountCents:i.outstandingCents,method:"transfer"}}).then(function(x){
            if(x.status===201) toast("Thanks — the office will reconcile your payment","ok"); else toast((x.body||{}).error||"Error","err");
          });
        }},["I've paid this"]) ])
      ]);
    });
    wrap.appendChild(h("table",{},[ h("thead",{},[h("tr",{},[th("Invoice"),th("Due"),th("Amount"),th("")])]), h("tbody",{},rows) ]));
    wrap.appendChild(h("div",{class:"muted",style:"font-size:12px;margin-top:6px"},["Payments are made by bank transfer to the office; use “I've paid this” after you send it so they can reconcile."]));
  }); }
  function refreshWorkOrders(wrap){ api("/resident/work-orders").then(function(r){ wrap.innerHTML="";
    var list=((r.body||{}).workOrders)||[];
    if(!list.length){ wrap.appendChild(h("div",{class:"muted",style:"font-size:13px"},["No maintenance requests yet."])); return; }
    var rows=list.slice().sort(function(a,b){return (b.openedAt||"").localeCompare(a.openedAt||"");}).map(function(w){
      var cls = w.status==="completed"?"ok":(w.status==="cancelled"?"warn":"");
      return h("tr",{},[ h("td",{},[w.title]), h("td",{class:"muted"},[(w.priority||"—")]), h("td",{},[h("span",{class:"pill "+cls},[w.status.replace("_"," ")])]), h("td",{class:"muted"},[(w.openedAt||"").slice(0,10)]) ]);
    });
    var tbl=h("table",{},[ h("thead",{},[h("tr",{},[th("Request"),th("Priority"),th("Status"),th("Opened")])]), h("tbody",{},rows) ]);
    wrap.appendChild(tbl);
  }); }
  function th(x){ return h("th",{},[x]); }

  boot();
})();
</script>
