<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f9cf9'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23052' font-family='Arial' font-weight='bold'%3EU%3C/text%3E%3C/svg%3E" />
<title>Unified Stay OS</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --panel2: #1e242c; --line: #2a323c;
    --text: #e7ecf2; --muted: #9aa7b4; --accent: #4f9cf9; --accent2: #35c28f;
    --danger: #f2586b; --warn: #e6b34d; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--text); }
  a { color: var(--accent); }
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; padding: 6px 10px 16px; }
  .brand small { display:block; color: var(--muted); font-weight: 500; font-size: 12px; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--muted);
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button:hover { background: var(--panel2); color: var(--text); }
  nav button.active { background: var(--accent); color: #05192f; font-weight: 600; }
  main { padding: 26px 30px; max-width: 980px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .card .v { font-size: 24px; font-weight: 700; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.draft { background: #3a3320; color: var(--warn); }
  .pill.active { background: #123a2c; color: var(--accent2); }
  .pill.completed, .pill.terminated { background: #2a323c; color: var(--muted); }
  .pill.ok { background:#123a2c; color: var(--accent2); }
  .pill.bad { background:#3a1f24; color: var(--danger); }
  form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; align-items: end; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input, select { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 10px; border-radius: 8px; font-size: 14px; }
  button.btn { background: var(--accent); color: #05192f; border: 0; padding: 10px 16px; border-radius: 8px;
    font-weight: 600; cursor: pointer; font-size: 14px; }
  button.btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  button.btn.sm { padding: 6px 11px; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--panel2); border: 1px solid var(--line);
    padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.4); max-width: 340px; }
  .toast.err { border-color: var(--danger); }
  .toast.ok { border-color: var(--accent2); }
  .muted { color: var(--muted); }
  .tokenbar { display:flex; gap:8px; align-items:center; margin-bottom: 16px; }
  .tokenbar input { max-width: 220px; }
  .perms { display: flex; flex-wrap: wrap; gap: 6px; }
  .perm { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; font-size: 11px; color: var(--muted); }
  .checks { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 4px 14px; margin: 8px 0; }
  .checks label { display:flex; gap:7px; align-items:center; color: var(--text); font-size: 13px; margin: 0; }
  .checks input { width: auto; }
  .wizard { max-width: 520px; margin: 40px auto; }
  .center { display:flex; min-height: 60vh; align-items:center; justify-content:center; }
  @media (max-width: 720px){ .app{ grid-template-columns: 1fr; } aside{ display:none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
(function () {
  var TOKEN_KEY = "usos.token";
  var state = { token: localStorage.getItem(TOKEN_KEY) || "", me: null, config: null, options: null, cat: {}, view: "dashboard" };

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs) {
      if (k === "class") el.className = attrs[k];
      else if (k === "html") el.innerHTML = attrs[k];
      else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) el.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }
  function t(key) { return state.cat[key] || key; }

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, {
      method: opts.method || "GET",
      headers: { "authorization": "Bearer " + state.token, "content-type": "application/json" },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); });
  }

  function minorUnits(code) {
    var c = (state.options && state.options.currencies || []).find(function (x){ return x.code === code; });
    return c ? c.minorUnits : 2;
  }
  function fmt(minor) {
    if (!state.config) return String(minor);
    var mu = minorUnits(state.config.currency);
    try {
      return new Intl.NumberFormat(state.config.locale, { style: "currency", currency: state.config.currency }).format(minor / Math.pow(10, mu));
    } catch (e) { return (minor / Math.pow(10, mu)).toFixed(mu) + " " + state.config.currency; }
  }

  function toast(msg, kind) {
    var el = h("div", { class: "toast " + (kind || "") }, [msg]);
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }

  function can(p) { return state.me && state.me.permissions.indexOf(p) >= 0; }

  // ---- bootstrapping ------------------------------------------------------
  function boot() {
    if (!state.token) return renderTokenGate();
    api("/me").then(function (r) {
      if (r.status !== 200) { state.token = ""; localStorage.removeItem(TOKEN_KEY); return renderTokenGate("Invalid token."); }
      state.me = r.body;
      return api("/config").then(function (c) {
        state.config = c.body.config; state.options = c.body.options;
        return api("/i18n/" + state.config.locale).then(function (i) {
          state.cat = i.body;
          if (state.config.displayName === state.config.tenantId) return renderSetup(true);
          render();
        });
      });
    });
  }

  function renderTokenGate(err) {
    var input = h("input", { placeholder: "Bearer token", value: state.token });
    var root = document.getElementById("root");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "center" }, [
      h("div", { class: "wizard panel" }, [
        h("h1", {}, ["Unified Stay OS"]),
        h("p", { class: "sub" }, ["Sign in with your access token."]),
        err ? h("p", { class: "pill bad", style: "padding:6px 10px;" }, [err]) : null,
        h("div", { style: "margin:14px 0;" }, [input]),
        h("button", { class: "btn", onclick: function () {
          state.token = input.value.trim(); localStorage.setItem(TOKEN_KEY, state.token); boot();
        } }, ["Continue"])
      ])
    ]));
  }

  // ---- setup wizard -------------------------------------------------------
  function renderSetup(initial) {
    var cfg = state.config, opt = state.options;
    var name = h("input", { value: initial ? "" : cfg.displayName, placeholder: "e.g. Copacabana Stays" });
    var locale = selectFrom(opt.locales.map(function (l){ return [l.code, l.name]; }), cfg.locale);
    var currency = selectFrom(opt.currencies.map(function (c){ return [c.code, c.code + " — " + c.name]; }), cfg.currency);
    var tz = h("input", { value: cfg.timezone });
    var biz = selectFrom(opt.businessStructures.map(function (b){ return [b, b.replace(/_/g," ")]; }), cfg.businessStructure);
    var root = document.getElementById("root");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "center" }, [
      h("div", { class: "wizard panel" }, [
        h("h1", {}, [t("setup.title")]),
        h("p", { class: "sub" }, ["Switch language and currency any time — it flows through the whole ledger."]),
        field(t("setup.displayName"), name),
        field(t("setup.language"), locale),
        field(t("setup.currency"), currency),
        field(t("setup.timezone"), tz),
        field(t("setup.businessStructure"), biz),
        h("div", { style:"margin-top:16px;" }, [
          h("button", { class: "btn", onclick: function () {
            api("/config", { method: "PUT", body: { displayName: name.value || "My Workspace", locale: locale.value, currency: currency.value, timezone: tz.value, businessStructure: biz.value } })
              .then(function (r) {
                if (r.status !== 200) return toast(r.body.error || t("msg.denied"), "err");
                state.config = r.body;
                api("/i18n/" + state.config.locale).then(function (i){ state.cat = i.body; state.view = "dashboard"; render(); toast(t("msg.saved"), "ok"); });
              });
          } }, [t("setup.finish")])
        ])
      ])
    ]));
  }
  function selectFrom(pairs, sel) {
    return h("select", {}, pairs.map(function (p){ return h("option", { value: p[0], selected: p[0]===sel ? "selected" : null }, [p[1]]); }));
  }
  function field(labelText, control) { return h("div", { style:"margin:12px 0;" }, [h("label", {}, [labelText]), control]); }

  // ---- shell --------------------------------------------------------------
  function render() {
    var items = [
      ["dashboard", t("nav.dashboard")],
      ["agreements", t("nav.agreements")],
      ["ledger", t("nav.ledger")],
      ["people", t("nav.people")],
      ["settings", t("nav.settings")]
    ];
    var nav = h("nav", {}, items.map(function (it) {
      return h("button", { class: state.view === it[0] ? "active" : "", onclick: function () { state.view = it[0]; render(); } }, [it[1]]);
    }));
    var root = document.getElementById("root");
    root.innerHTML = "";
    root.appendChild(h("div", { class: "app" }, [
      h("aside", {}, [
        h("div", { class: "brand" }, [state.config.displayName, h("small", {}, [state.me.role + " · " + state.config.currency + " · " + state.config.locale])]),
        nav
      ]),
      h("main", { id: "main" }, [])
    ]));
    var main = document.getElementById("main");
    ({ dashboard: viewDashboard, agreements: viewAgreements, ledger: viewLedger, people: viewPeople, settings: viewSettings }[state.view] || viewDashboard)(main);
  }

  // ---- views --------------------------------------------------------------
  function viewDashboard(main) {
    main.appendChild(h("h1", {}, [t("nav.dashboard")]));
    main.appendChild(h("p", { class: "sub" }, [state.config.displayName + " · " + prettyBiz(state.config.businessStructure)]));
    var cards = h("div", { class: "cards" }, []);
    main.appendChild(cards);
    api("/reporting/summary").then(function (r) {
      if (r.status !== 200) return cards.appendChild(h("p", { class: "muted" }, [r.body.error || t("msg.denied")]));
      var s = r.body;
      card(cards, t("card.agreements"), String(s.agreements.total));
      card(cards, t("ledger.trialBalance"), s.ledger.balanced ? t("ledger.balanced") : t("ledger.unbalanced"), s.ledger.balanced ? "ok" : "bad");
      card(cards, t("card.units"), String(s.masterDataCounts.units));
      card(cards, t("card.subscription"), fmtPlan(s.subscription));
      var byStatus = s.agreements.byStatus; var line = Object.keys(byStatus).map(function (k){ return byStatus[k]+" "+t("status."+k); }).join(" · ");
      main.appendChild(h("h2", {}, [t("dash.portfolio")]));
      main.appendChild(h("div", { class: "panel" }, [ h("div", { class:"muted" }, [ line || t("dash.noAgreements") ]) ]));
    });
  }
  function fmtPlan(sub) {
    try { return new Intl.NumberFormat(state.config.locale, { style:"currency", currency: sub.currency }).format(sub.totalCents / 100) + " " + t("msg.perMonth"); }
    catch (e) { return (sub.totalCents/100) + " " + sub.currency; }
  }
  function card(container, k, v, pill) {
    container.appendChild(h("div", { class: "card" }, [ h("div", { class:"k" }, [k]), h("div", { class:"v" }, [ pill ? h("span",{class:"pill "+pill},[v]) : v ]) ]));
  }
  function prettyBiz(b){ return String(b).replace(/_/g," "); }

  function viewAgreements(main) {
    main.appendChild(h("h1", {}, [t("nav.agreements")]));
    main.appendChild(h("p", { class:"sub" }, [t("agreements.subtitle")]));
    var formSlot = h("div", {}, []); main.appendChild(formSlot);
    var tableWrap = h("div", {}, []); main.appendChild(tableWrap);
    // Book form uses real master data (units, guests, rate plans) — no free text.
    if (can("agreement.book")) api("/master-data").then(function(m){ formSlot.appendChild(bookForm(m.body || {})); });
    refreshAgreements(tableWrap);
  }
  function bookForm(md) {
    var units = md.units || [], guests = md.guests || [], plans = md.ratePlans || [];
    var guest = selectFrom(guests.map(function(g){ return [g.id, g.fullName + " (" + g.code + ")"]; }), guests[0] && guests[0].id);
    var unit = selectFrom(units.map(function(u){ return [u.id, u.code + " — " + u.label]; }), units[0] && units[0].id);
    var kind = selectFrom([["nightly",t("kind.nightly")],["monthly",t("kind.monthly")],["lease",t("kind.lease")]],"nightly");
    var start = h("input",{value:"2026-07-01",type:"date"}); var end = h("input",{value:"2026-07-10",type:"date"});
    var rate = h("input",{value:"20000",type:"number"});
    // Optional: pick a rate plan to prefill tenure + rate from master data.
    var planSel = null;
    if (plans.length) {
      planSel = selectFrom([["", t("field.ratePlanNone")]].concat(plans.map(function(p){ return [p.id, p.code + " — " + p.name]; })), "");
      planSel.addEventListener("change", function(){
        var p = plans.find(function(x){ return x.id === planSel.value; });
        if (p) { kind.value = p.kind; rate.value = String(p.baseMinor); }
      });
    }
    var cells = [];
    if (planSel) cells.push(field(t("field.ratePlan"), planSel));
    cells.push(field(t("field.guest"), guest), field(t("field.unit"), unit), field(t("field.kind"), kind),
      field(t("field.start"), start), field(t("field.end"), end), field(t("field.rate")+" (minor)", rate),
      h("div",{},[h("button",{class:"btn",type:"submit"},[t("action.book")])]));
    if (!units.length || !guests.length) {
      return h("div",{class:"panel muted"},["Add at least one unit and guest in master data to book."]);
    }
    return h("form", { class:"grid panel", onsubmit: function(e){ e.preventDefault();
      api("/agreements",{method:"POST",body:{id:"ag-"+Date.now(),guestId:guest.value,unitId:unit.value,kind:kind.value,start:start.value,end:end.value,rateCents:parseInt(rate.value,10)}})
        .then(function(r){ handleMut(r, "agreements"); });
    }}, cells);
  }
  function refreshAgreements(wrap) {
    api("/agreements").then(function(r){
      wrap.innerHTML="";
      var rows = (r.body.agreements||[]).map(function(a){
        var actions = h("div",{class:"row"},[]);
        if (a.status==="draft" && can("agreement.activate")) actions.appendChild(h("button",{class:"btn ghost sm",onclick:function(){ api("/agreements/"+a.id+"/activate",{method:"POST",body:{}}).then(function(x){handleMut(x,"agreements");}); }},[t("action.activate")]));
        if (a.status==="active" && a.kind!=="lease" && can("agreement.convert")) {
          var to = a.kind==="nightly" ? "monthly" : "lease";
          actions.appendChild(h("button",{class:"btn ghost sm",onclick:function(){ api("/agreements/"+a.id+"/convert",{method:"POST",body:{to:to}}).then(function(x){handleMut(x,"agreements");}); }},[t("action.convert")+" → "+t("kind."+to)]));
        }
        return h("tr",{},[ h("td",{},[a.id]), h("td",{},[t("kind."+a.kind)]), h("td",{},[h("span",{class:"pill "+a.status},[t("status."+a.status)])]), h("td",{},[fmt(a.rateCents)]), h("td",{},[actions]) ]);
      });
      wrap.appendChild(h("table",{},[ h("thead",{},[h("tr",{},[th(t("field.id")),th(t("field.kind")),th(t("field.status")),th(t("field.rate")),th("")])]), h("tbody",{},rows.length?rows:[h("tr",{},[h("td",{colspan:"5",class:"muted"},[t("dash.noAgreements")])])]) ]));
    });
  }

  function viewLedger(main) {
    main.appendChild(h("h1", {}, [t("nav.ledger")]));
    var wrap = h("div",{},[]); main.appendChild(wrap);
    api("/ledger/trial-balance").then(function(r){
      if (r.status!==200) return wrap.appendChild(h("p",{class:"muted"},[r.body.error||t("msg.denied")]));
      var b = r.body; var rows = Object.keys(b.balances).sort().map(function(acc){ return h("tr",{},[h("td",{},[acc]),h("td",{},[fmt(b.balances[acc])])]); });
      wrap.appendChild(h("p",{class:"sub"},[t("ledger.trialBalance")+": ", h("span",{class:"pill "+(b.balanced?"ok":"bad")},[b.balanced?t("ledger.balanced"):t("ledger.unbalanced")])]));
      wrap.appendChild(h("table",{},[ h("thead",{},[h("tr",{},[th(t("field.account")),th(t("field.balance"))])]), h("tbody",{},rows.length?rows:[h("tr",{},[h("td",{colspan:"2",class:"muted"},[t("ledger.noPostings")])])]) ]));
    });
  }

  function viewPeople(main) {
    main.appendChild(h("h1", {}, [t("nav.people")]));
    main.appendChild(h("p",{class:"sub"},[t("people.subtitle")]));
    // Roles
    main.appendChild(h("h2",{},[t("people.roles")]));
    var rolesWrap = h("div",{},[]); main.appendChild(rolesWrap);
    api("/roles").then(function(r){
      rolesWrap.innerHTML="";
      (r.body.roles||[]).forEach(function(role){
        rolesWrap.appendChild(h("div",{class:"panel"},[
          h("div",{class:"row",style:"justify-content:space-between"},[
            h("div",{},[h("strong",{},[role.name])," ",h("span",{class:"muted"},["("+role.id+")"]), role.builtin?h("span",{class:"perm",style:"margin-left:8px"},[t("people.builtin")]):null]),
          ]),
          role.description?h("div",{class:"muted",style:"margin:4px 0 8px"},[role.description]):null,
          h("div",{class:"perms"}, role.permissions.map(function(p){ return h("span",{class:"perm"},[p]); }))
        ]));
      });
    });
    if (can("role.manage")) main.appendChild(customRoleForm(function(){ viewPeople(clear(main)); }));
    // Users
    main.appendChild(h("h2",{},[t("people.users")]));
    var usersWrap = h("div",{},[]); main.appendChild(usersWrap);
    refreshUsers(usersWrap);
    if (can("user.manage")) main.appendChild(addUserForm(usersWrap));
  }
  function customRoleForm(done) {
    var id=h("input",{placeholder:"housekeeping_lead"}); var name=h("input",{placeholder:"Housekeeping Lead"});
    var checks=h("div",{class:"checks"},[]);
    var box = h("div",{class:"panel"},[ h("strong",{},[t("people.newRole")]),
      h("div",{class:"grid",style:"margin:10px 0"},[field(t("people.roleId"),id),field(t("people.name"),name)]),
      h("label",{},[t("people.permissions")]), checks,
      h("button",{class:"btn sm",onclick:function(){
        api("/roles",{method:"POST",body:{id:id.value,name:name.value,permissions:selectedPerms(checks)}}).then(function(r){
          if(r.status!==201) return toast(r.body.error||t("msg.denied"),"err"); toast(t("msg.saved"),"ok"); done();
        });
      }},[t("people.createRole")]) ]);
    api("/permissions").then(function(r){ (r.body.permissions||[]).forEach(function(p){ checks.appendChild(h("label",{},[h("input",{type:"checkbox",value:p}),p])); }); });
    return box;
  }
  function selectedPerms(checks){ return Array.prototype.slice.call(checks.querySelectorAll("input:checked")).map(function(i){return i.value;}); }
  function refreshUsers(wrap){
    api("/users").then(function(r){
      wrap.innerHTML="";
      var rows=(r.body.users||[]).map(function(u){ return h("tr",{},[h("td",{},[u.displayName]),h("td",{},[u.code]),h("td",{},[h("span",{class:"pill active"},[u.roleId])]),h("td",{},[u.active?"active":"inactive"])]); });
      wrap.appendChild(h("table",{},[ h("thead",{},[h("tr",{},[th(t("people.name")),th(t("people.code")),th(t("field.role")),th("")])]), h("tbody",{},rows.length?rows:[h("tr",{},[h("td",{colspan:"4",class:"muted"},[t("people.noUsers")])])]) ]));
    });
  }
  function addUserForm(usersWrap){
    var id=h("input",{value:"u-"+Math.floor(Date.now()/1000)}); var code=h("input",{placeholder:"EMP-01"}); var name=h("input",{placeholder:"Full name"});
    var roleSel=h("select",{},[]);
    api("/roles").then(function(r){ (r.body.roles||[]).forEach(function(role){ roleSel.appendChild(h("option",{value:role.id},[role.name])); }); });
    return h("form",{class:"grid panel",onsubmit:function(e){ e.preventDefault();
      api("/users",{method:"POST",body:{id:id.value,code:code.value,displayName:name.value,roleId:roleSel.value}}).then(function(r){
        if(r.status!==201) return toast(r.body.error||t("msg.denied"),"err"); toast(t("msg.saved"),"ok"); refreshUsers(usersWrap);
      });
    }},[ field(t("people.code"),code), field(t("people.name"),name), field(t("field.role"),roleSel), h("div",{},[h("button",{class:"btn",type:"submit"},[t("people.addUser")])]) ]);
  }

  function viewSettings(main) {
    main.appendChild(h("h1", {}, [t("nav.settings")]));
    if (can("config.manage")) { renderSettingsForm(main); }
    else main.appendChild(h("p",{class:"muted"},[t("msg.denied")]));
  }
  function renderSettingsForm(main){
    var cfg=state.config, opt=state.options;
    var name=h("input",{value:cfg.displayName});
    var locale=selectFrom(opt.locales.map(function(l){return[l.code,l.name];}),cfg.locale);
    var currency=selectFrom(opt.currencies.map(function(c){return[c.code,c.code+" — "+c.name];}),cfg.currency);
    var tz=h("input",{value:cfg.timezone});
    var biz=selectFrom(opt.businessStructures.map(function(b){return[b,b.replace(/_/g," ")];}),cfg.businessStructure);
    main.appendChild(h("div",{class:"panel"},[
      h("div",{class:"grid"},[field(t("setup.displayName"),name),field(t("setup.language"),locale),field(t("setup.currency"),currency),field(t("setup.timezone"),tz),field(t("setup.businessStructure"),biz)]),
      h("div",{style:"margin-top:14px"},[h("button",{class:"btn",onclick:function(){
        api("/config",{method:"PUT",body:{displayName:name.value,locale:locale.value,currency:currency.value,timezone:tz.value,businessStructure:biz.value}}).then(function(r){
          if(r.status!==200) return toast(r.body.error||t("msg.denied"),"err");
          state.config=r.body; api("/i18n/"+state.config.locale).then(function(i){ state.cat=i.body; toast(t("msg.saved"),"ok"); render(); });
        });
      }},[t("action.save")])])
    ]));
  }

  // ---- helpers ------------------------------------------------------------
  function th(x){ return h("th",{},[x]); }
  function clear(el){ el.innerHTML=""; return el; }
  function handleMut(r, refreshView){
    if (r.status===202) return toast(t("msg.escalated"),"");
    if (r.status===403) return toast(t("msg.denied"),"err");
    if (r.status>=400) return toast(r.body.error||("Error "+r.status),"err");
    toast(t("msg.saved"),"ok");
    if (state.view===refreshView) render();
  }

  boot();
})();
</script>
</body>
</html>
